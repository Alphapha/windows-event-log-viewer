<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows事件日志查看器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .sidebar-header h2 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .sidebar-header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .category-filter {
            padding: 10px;
            border-bottom: 1px solid #e0e0e0;
            background: #f8f9fa;
        }

        .category-select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            background: #fff;
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .category-group {
            margin-bottom: 10px;
        }

        .category-title {
            font-size: 12px;
            color: #666;
            padding: 5px 10px;
            background: #e9ecef;
            border-radius: 4px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .file-item {
            padding: 10px 12px;
            margin-bottom: 3px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            background: #fff;
            border: 1px solid #f0f0f0;
        }

        .file-item:hover {
            background: #e9ecef;
            transform: translateX(3px);
        }

        .file-item.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .file-item .filename {
            font-weight: 500;
            font-size: 13px;
            margin-bottom: 3px;
        }

        .file-item .filesize {
            font-size: 11px;
            opacity: 0.7;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toolbar {
            background: #fff;
            padding: 15px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .toolbar h3 {
            font-size: 16px;
            color: #333;
            min-width: 150px;
        }

        .field-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            flex: 1;
        }

        .field-checkbox {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-size: 13px;
            padding: 5px 10px;
            background: #f8f9fa;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .field-checkbox:hover {
            background: #e9ecef;
        }

        .field-checkbox input[type="checkbox"] {
            cursor: pointer;
        }

        .content-area {
            flex: 1;
            overflow: auto;
            padding: 20px;
            background: #fafafa;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }

        .empty-state {
            text-align: center;
            padding: 100px 20px;
            color: #999;
        }

        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .empty-state p {
            font-size: 16px;
        }

        .event-table {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            background: #f8f9fa;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            padding: 12px 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
            white-space: nowrap;
        }

        td {
            padding: 10px 15px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: top;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .level-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }

        .level-严重 {
            background: #dc3545;
            color: white;
        }

        .level-错误 {
            background: #fd7e14;
            color: white;
        }

        .level-警告 {
            background: #ffc107;
            color: #333;
        }

        .level-信息 {
            background: #28a745;
            color: white;
        }

        .level-详细 {
            background: #17a2b8;
            color: white;
        }

        .event-data {
            max-width: 300px;
            max-height: 100px;
            overflow: auto;
            background: #f8f9fa;
            padding: 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
        }

        .raw-xml {
            max-width: 400px;
            max-height: 150px;
            overflow: auto;
            background: #f8f9fa;
            padding: 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            white-space: pre-wrap;
        }

        .stats-bar {
            background: #fff;
            padding: 10px 20px;
            border-top: 1px solid #e0e0e0;
            font-size: 12px;
            color: #666;
            display: flex;
            justify-content: space-between;
        }

        .cache-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            background: #28a745;
            color: white;
            margin-left: 10px;
        }

        .refresh-btn {
            padding: 5px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background: #e9ecef;
            border-color: #667eea;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>📁 事件日志文件</h2>
                <p>选择要查看的日志文件</p>
            </div>
            <div class="category-filter">
                <select class="category-select" id="categoryFilter" onchange="filterByCategory()">
                    <option value="all">📂 全部日志类型</option>
                    <option value="安全日志">🔒 安全日志</option>
                    <option value="系统日志">⚙️ 系统日志</option>
                    <option value="应用程序日志">📦 应用程序日志</option>
                    <option value="Setup日志">🔧 Setup日志</option>
                    <option value="其他日志">📄 其他日志</option>
                </select>
            </div>
            <div class="file-list" id="fileList">
                <div class="loading">加载中...</div>
            </div>
        </div>

        <div class="main-content">
            <div class="toolbar">
                <h3 id="currentFile">请选择文件</h3>
                <button class="refresh-btn" onclick="refreshCurrentFile()" title="重新解析（不使用缓存）">🔄 刷新</button>
                <div class="field-selector" id="fieldSelector"></div>
            </div>

            <div class="content-area" id="contentArea">
                <div class="empty-state">
                    <div class="icon">📋</div>
                    <p>请从左侧选择一个日志文件查看</p>
                </div>
            </div>

            <div class="stats-bar" id="statsBar" style="display: none;">
                <span id="statsInfo"></span>
                <span id="timestamp"></span>
            </div>
        </div>
    </div>

    <script>
        let currentEvents = [];
        let availableFields = [];
        let selectedFields = new Set();
        let allCategories = {};
        let currentFile = '';

        async function loadFiles() {
            try {
                const response = await fetch('/api/files');
                const data = await response.json();
                
                const fileList = document.getElementById('fileList');
                
                if (!data.categories || Object.keys(data.categories).length === 0) {
                    fileList.innerHTML = '<div class="empty-state"><p>未找到EVTX文件</p></div>';
                    return;
                }

                allCategories = data.categories;
                renderFileList();
            } catch (error) {
                console.error('加载文件列表失败:', error);
            }
        }

        function renderFileList() {
            const fileList = document.getElementById('fileList');
            const filterValue = document.getElementById('categoryFilter').value;
            
            let html = '';
            
            for (const [category, files] of Object.entries(allCategories)) {
                if (filterValue !== 'all' && category !== filterValue) {
                    continue;
                }
                
                html += `<div class="category-group">`;
                html += `<div class="category-title">${category} (${files.length})</div>`;
                
                files.forEach(file => {
                    html += `
                        <div class="file-item" onclick="loadEvents('${file.filename}')" data-filename="${file.filename}">
                            <div class="filename">${file.filename}</div>
                            <div class="filesize">${formatFileSize(file.size)}</div>
                        </div>
                    `;
                });
                
                html += '</div>';
            }
            
            fileList.innerHTML = html || '<div class="empty-state"><p>该类别下没有文件</p></div>';
        }

        function filterByCategory() {
            renderFileList();
        }

        async function loadFields() {
            try {
                const response = await fetch('/api/fields');
                const data = await response.json();
                availableFields = data.fields;
                
                selectedFields = new Set(
                    data.fields.filter(f => f.default).map(f => f.id)
                );
                
                renderFieldSelector();
            } catch (error) {
                console.error('加载字段列表失败:', error);
            }
        }

        function renderFieldSelector() {
            const selector = document.getElementById('fieldSelector');
            selector.innerHTML = availableFields.map(field => `
                <label class="field-checkbox">
                    <input type="checkbox" 
                           value="${field.id}" 
                           ${selectedFields.has(field.id) ? 'checked' : ''}
                           onchange="toggleField('${field.id}')">
                    ${field.name}
                </label>
            `).join('');
        }

        function toggleField(fieldId) {
            if (selectedFields.has(fieldId)) {
                selectedFields.delete(fieldId);
            } else {
                selectedFields.add(fieldId);
            }
            renderEvents();
        }

        async function loadEvents(filename, forceRefresh = false) {
            currentFile = filename;
            
            document.querySelectorAll('.file-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.filename === filename) {
                    item.classList.add('active');
                }
            });

            document.getElementById('currentFile').textContent = filename;
            document.getElementById('contentArea').innerHTML = forceRefresh 
                ? '<div class="loading">正在重新解析日志文件...</div>'
                : '<div class="loading">正在解析日志文件...</div>';

            try {
                const url = forceRefresh 
                    ? `/api/events?filename=${encodeURIComponent(filename)}&refresh=true`
                    : `/api/events?filename=${encodeURIComponent(filename)}`;
                    
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.status === 'error') {
                    document.getElementById('contentArea').innerHTML = `<div class="empty-state"><p>加载失败: ${data.message}</p></div>`;
                    return;
                }

                currentEvents = data.events;
                
                const cacheInfo = data.from_cache ? '<span class="cache-badge">✓ 缓存加载</span>' : '';
                document.getElementById('statsBar').style.display = 'flex';
                document.getElementById('statsInfo').innerHTML = `共 ${data.total} 条事件记录 | 解析耗时 ${data.parse_time}秒${cacheInfo}`;
                document.getElementById('timestamp').textContent = `加载时间: ${new Date().toLocaleString('zh-CN')}`;
                
                renderEvents();
            } catch (error) {
                console.error('加载事件失败:', error);
                document.getElementById('contentArea').innerHTML = '<div class="empty-state"><p>加载失败，请稍后重试</p></div>';
            }
        }

        function refreshCurrentFile() {
            if (currentFile) {
                loadEvents(currentFile, true);
            }
        }

        function renderEvents() {
            if (currentEvents.length === 0) {
                document.getElementById('contentArea').innerHTML = '<div class="empty-state"><p>没有事件记录</p></div>';
                return;
            }

            const fields = availableFields.filter(f => selectedFields.has(f.id));
            
            let html = '<div class="event-table"><table>';
            
            html += '<thead><tr>';
            fields.forEach(field => {
                html += `<th>${field.name}</th>`;
            });
            html += '</tr></thead>';
            
            html += '<tbody>';
            currentEvents.forEach(event => {
                html += '<tr>';
                fields.forEach(field => {
                    html += `<td>${formatFieldValue(field.id, event)}</td>`;
                });
                html += '</tr>';
            });
            html += '</tbody></table></div>';
            
            document.getElementById('contentArea').innerHTML = html;
        }

        function formatFieldValue(fieldId, event) {
            const value = event[fieldId];
            
            if (fieldId === 'Level' && value) {
                return `<span class="level-badge level-${value}">${value}</span>`;
            }
            
            if (fieldId === 'EventData' && value && typeof value === 'object') {
                const dataStr = Object.entries(value)
                    .map(([k, v]) => `${k}: ${v}`)
                    .join('\n');
                return `<div class="event-data">${dataStr}</div>`;
            }
            
            if (fieldId === 'RawXML' && value) {
                return `<div class="raw-xml">${escapeHtml(value)}</div>`;
            }
            
            return value ? escapeHtml(String(value)) : '-';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadFiles();
            loadFields();
        });
    </script>
</body>
</html>
